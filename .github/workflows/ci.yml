name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift · build + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  cocoapods:
    name: CocoaPods · lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint ATCParserKit.podspec --allow-warnings

  xcframework:
    name: Unity · build xcframework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build xcframework
        run: ./scripts/build-xcframework.sh
      - name: Verify exported C symbols
        # Every symbol the Unity C# binding P/Invokes by name. A missing one fails at
        # runtime inside the engine with no compile-time warning, so it is checked here
        # rather than discovered in a game.
        run: |
          for SLICE in ios-arm64 ios-arm64_x86_64-simulator; do
            LIB="platforms/unity/Runtime/Plugins/iOS/ATCParserFFI.xcframework/$SLICE/libATCParserFFI.a"
            for SYMBOL in atc_parser_parse atc_parser_free \
                          atc_recognizer_create atc_recognizer_recognize \
                          atc_recognizer_diagnostics atc_recognizer_release; do
              nm "$LIB" | grep -q "T _$SYMBOL" || {
                echo "::error::missing $SYMBOL in $SLICE"; exit 1; }
            done
            echo "$SLICE: all 6 C symbols present."
          done

  react-native:
    name: React Native · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Typecheck (isolated — react-native types are shimmed)
        run: npx -y -p typescript@5.3.3 tsc --noEmit
      - name: Validate package
        run: npm pack --dry-run --legacy-peer-deps
